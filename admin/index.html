<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#194738">
  <title>ورود به مدیریت آموزشگاه | دایان حسابداری</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; padding: 1.25rem; display: grid; place-items: center; background: #f8f7f2; color: #172e27; font: 1rem/1.95 Tahoma, sans-serif; }
    main { width: min(100%, 29rem); padding: clamp(1.5rem, 6vw, 3rem); background: #fffefa; border: 1px solid #d9dfd3; border-block-start: .3rem solid #194738; border-radius: .9rem; }
    .brand { display: flex; align-items: center; gap: .55rem; color: #194738; font-weight: 700; }
    .mark { display: inline-flex; align-items: end; gap: 2px; height: 1.4rem; }
    .mark i { width: .3rem; background: currentColor; border-radius: 2px; }
    .mark i:nth-child(1) { height: 100%; } .mark i:nth-child(2) { height: 75%; } .mark i:nth-child(3) { height: 50%; }
    h1 { margin: 1.4rem 0 .35rem; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.5; }
    p { margin: 0 0 1.5rem; color: #53635a; }
    a { color: #194738; text-underline-offset: .24em; }
    .login { display: block; margin-block-end: 1rem; padding: .65rem 1rem; border-radius: .5rem; background: #194738; color: white; text-align: center; font-weight: 700; text-decoration: none; }
    .login:hover { background: #10392e; }
    a:focus-visible { outline: 3px solid #9b6d39; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>دایان حسابداری</div>
    <h1>مدیریت آموزشگاه</h1>
    <p>برای ویرایش دوره‌ها و آموزش‌های رایگان، با ایمیلی که برای مدیریت دعوت شده است وارد شوید.</p>
    <a class="login" href="https://app.pagescms.org/sdhadi/dayan-hesabdar/main">ورود به پنل مدیریت</a>
    <a href="../index.html">بازگشت به سایت</a>
  </main>
</body>
</html>
